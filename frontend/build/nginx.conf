server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Same relative-path API client used by `npm run dev`'s Vite proxy --
    # here nginx does the equivalent proxying to the api container.
    location /api/ {
        proxy_pass http://api:8000/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_http_version 1.1;
        proxy_set_header Connection "";  # required for SSE (scan event stream) to work through the proxy
        proxy_buffering off;             # required so SSE events flush immediately, not buffered by nginx
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
