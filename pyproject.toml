[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "swarmshield"
version = "0.1.0"
description = "Security middleware gateway for agent-to-agent (A2A) communication in AI swarms"
requires-python = ">=3.10"
dependencies = ["fastapi>=0.115", "uvicorn[standard]>=0.30", "pydantic>=2.7", "pyyaml>=6.0", "httpx>=0.27"]

[project.optional-dependencies]
langchain = ["langchain>=1.0", "langchain-core>=1.0"]
langgraph = ["langgraph>=1.0", "langchain-core>=1.0"]
demo = ["rich>=13.7"]
test = ["pytest>=8", "pytest-asyncio>=0.23"]

[tool.setuptools.packages.find]
include = ["swarmshield*"]

[tool.setuptools.package-data]
swarmshield = ["policies/*.yaml"]
